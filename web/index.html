<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A calm climbing game. Move one hand or foot at a time.">
  <meta name="theme-color" content="#11141b">

  <!-- Link previews -->
  <meta property="og:title" content="Topout">
  <meta property="og:description" content="A calm climbing game. Move one hand or foot at a time.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Topout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Start loading the big pieces right away -->
  <link rel="preload" href="assets/assets/fonts/BigShouldersDisplay-Black.ttf" as="font" type="font/ttf" crossorigin>

  <title>Topout</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: 'Big Shoulders';
      src: url('assets/assets/fonts/BigShouldersDisplay-Black.ttf') format('truetype');
      font-weight: 900;
      font-display: swap;
    }
    html, body { margin: 0; height: 100%; background: #11141b; }
    /* Shown while the game loads, then it fades away (see flutter_bootstrap.js). */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, #0f1530 0%, #33386a 34%, #9a627a 58%, #f6a873 74%, #11141b 74.2%, #11141b 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity 0.5s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark {
      font-family: 'Big Shoulders', Impact, 'Arial Narrow', sans-serif;
      font-weight: 900; font-size: clamp(64px, 18vw, 132px); line-height: 0.8; letter-spacing: 0.01em;
      color: #f2ede4; text-shadow: 0 6px 30px rgba(10, 10, 20, 0.5);
    }
    #splash .mark span { color: #ff7a2f; }
    #splash .bar {
      width: min(220px, 52vw); height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(242, 237, 228, 0.16);
    }
    #splash .bar i {
      display: block; height: 100%; width: 38%; border-radius: 2px; background: #ff7a2f;
      animation: climb 1.3s ease-in-out infinite;
    }
    #splash .note { color: #aca8a0; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; }
    @keyframes climb { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar i { animation: none; width: 100%; opacity: 0.6; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <script>
    // Draw at most 2 device pixels per CSS pixel. On 3x phones that is 56%
    // fewer pixels to fill every frame, and the cel-shaded art looks the same.
    (function () {
      var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!d || !d.get || d.configurable === false) return;
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        get: function () { return Math.min(2, d.get.call(window)); },
      });
    })();
  </script>
  <div id="splash" role="status" aria-label="Loading Topout">
    <div class="mark">TOP<span>OUT</span></div>
    <div class="bar"><i></i></div>
    <div class="note">Chalking up</div>
  </div>
  <!--
    flutter_bootstrap.js (in this folder) loads the game and hides the splash
    once the first frame is on screen.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
